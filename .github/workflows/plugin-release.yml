name: Plugin Release

on:
  workflow_dispatch:
    inputs:
      skill-temporal-cloud-setup_package_strategy: &package_strategy
        required: true
        type: choice
        default: latest
        options: [patch, minor, major, latest, rollback]
      skill-temporal-cloud-setup_rollback_version: &rollback_version
        required: false
        type: string
        default: ''
      skill-temporal-developer_package_strategy: *package_strategy
      skill-temporal-developer_rollback_version: *rollback_version
      skill-temporal-ops_package_strategy: *package_strategy
      skill-temporal-ops_rollback_version: *rollback_version
      skill-temporal-serverless_package_strategy: *package_strategy
      skill-temporal-serverless_rollback_version: *rollback_version

permissions:
  contents: read

jobs:
  cloud_setup:
    name: Release skill-temporal-cloud-setup
    if: contains(fromJSON('["patch", "minor", "major"]'), inputs['skill-temporal-cloud-setup_package_strategy'])
    uses: ./.github/workflows/plugin-release-skill.yml
    with:
      skill_repo: skill-temporal-cloud-setup
      package_strategy: ${{ inputs['skill-temporal-cloud-setup_package_strategy'] }}
    secrets: inherit

  developer:
    name: Release skill-temporal-developer
    if: contains(fromJSON('["patch", "minor", "major"]'), inputs['skill-temporal-developer_package_strategy'])
    uses: ./.github/workflows/plugin-release-skill.yml
    with:
      skill_repo: skill-temporal-developer
      package_strategy: ${{ inputs['skill-temporal-developer_package_strategy'] }}
    secrets: inherit

  ops:
    name: Release skill-temporal-ops
    if: contains(fromJSON('["patch", "minor", "major"]'), inputs['skill-temporal-ops_package_strategy'])
    uses: ./.github/workflows/plugin-release-skill.yml
    with:
      skill_repo: skill-temporal-ops
      package_strategy: ${{ inputs['skill-temporal-ops_package_strategy'] }}
    secrets: inherit

  serverless:
    name: Release skill-temporal-serverless
    if: contains(fromJSON('["patch", "minor", "major"]'), inputs['skill-temporal-serverless_package_strategy'])
    uses: ./.github/workflows/plugin-release-skill.yml
    with:
      skill_repo: skill-temporal-serverless
      package_strategy: ${{ inputs['skill-temporal-serverless_package_strategy'] }}
    secrets: inherit
