name: Plugin Release Skill (reusable)

on:
  workflow_call:
    inputs:
      skill_repo:
        required: true
        type: string
      package_strategy:
        required: true
        type: string
    secrets:
      APP_CLIENT_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  bump_skill:
    runs-on: ubuntu-latest
    env:
      PACKAGE_STRATEGY: ${{ inputs.package_strategy }}

    steps:
      - name: Checkout skill-ci repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate token from GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: patbeqo
          repositories: ${{ inputs.skill_repo }}

      - name: Checkout skill repo
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: patbeqo/${{ inputs.skill_repo }}
          path: ${{ inputs.skill_repo }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Get current tag
        id: get_current_tag
        working-directory: ${{ inputs.skill_repo }}
        run: |
          if [[ -z "$(git tag --list)" ]]; then
            tag=v0.0.0
          else
            tag=$(git describe --tags --exact-match)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Bump version
        id: bump_version
        run: |
          new_version=$(uv run bump_version.py "${{ inputs.skill_repo }}/SKILL.md" "${{ steps.get_current_tag.outputs.tag }}" "$PACKAGE_STRATEGY")
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Create PR
        id: create_pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: ${{ inputs.skill_repo }}
          add-paths: SKILL.md
          branch: release/v${{ steps.bump_version.outputs.new_version }}
          base: main
          commit-message: Release v${{ steps.bump_version.outputs.new_version }}
          title: Release v${{ steps.bump_version.outputs.new_version }}
          body: Release v${{ steps.bump_version.outputs.new_version }}.

      - name: Merge PR
        id: merge_pr
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: patbeqo/${{ inputs.skill_repo }}
        run: |
          set -euo pipefail
          pr="${{ steps.create_pr.outputs.pull-request-number }}"
          gh pr merge "$pr" --auto --squash
          while true; do
            state="$(gh pr view "$pr" --json state --jq .state)"
            case "$state" in
              MERGED) exit 0 ;;
              CLOSED)
                echo "PR #$pr closed without merging" >&2
                exit 1
                ;;
            esac
            sleep 10
          done

      - name: Tag new release
        working-directory: ${{ inputs.skill_repo }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: patbeqo/${{ inputs.skill_repo }}
          NEW_VERSION: ${{ steps.bump_version.outputs.new_version }}
        run: |
          set -euo pipefail
          sha="$(gh pr view "${{ steps.create_pr.outputs.pull-request-number }}" --json mergeCommit --jq .mergeCommit.oid)"
          git fetch origin "$sha"
          git tag "v${NEW_VERSION}" "$sha"
          git push origin "v${NEW_VERSION}"
